<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Slopify – Audio Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo"><img src="images/slopify_icon_96.png" alt="slopify logo"> Slopify</div>
  </header>

  <div class="content">
    <!-- Track List -->
    <aside class="track-list">
      <div class="scroll-bar">
        <span>▲</span>
        <div class="bar"></div>
        <span>▼</span>
      </div>

      <div class="tracks">
        <div class="track active" 
             data-audio="audio/ClowningAround.ogg"
             data-title="Garbage Sewer"
             data-artist="Maxwell Tayler"
             data-context="As heard in: Fantasy RPG Prototype"
             data-image="images/GarbageSewer_Album.png">
          <img src="images/GarbageSewer_Album.png" />
          <div>
            <strong>Maxwell Tayler</strong>
            <p>Garbage Sewer</p>
          </div>
        </div>

        <div class="track"
             data-audio="audio/odd_dsd.ogg"
             data-title="PBR Artist Track 1"
             data-artist="Tayler Max"
             data-context="Song form PBR Artist video game"
             data-image="images/pbr_song_art.png">
          <img src="images/pbr_song_art.png" />
          <div>
            <strong>Tayler Max</strong>
            <p>PBR Artist Track 1</p>
          </div>
        </div>

        <div class="track"
             data-audio="audio/bassWashing.ogg"
             data-title="Bass Washing"
             data-artist="Max Tayler"
             data-context="As heard in: Sci-Fi Strategy UI"
             data-image="images/olite_mindomancer.png">
          <img src="images/olite_mindomancer.png" />
          <div>
            <strong>Your Name</strong>
            <p>Bass Washing</p>
          </div>

        </div>
          <div class="track"
             data-audio="audio/BF_4.mp3"
             data-title="Block-Fu Song"
             data-artist="Max Tyler"
             data-context="As heard in Game: Block-fu"
             data-image="images/block_fu_tumb_song.png">
          <img src="images/block_fu_tumb_song.png" />
          <div>
            <strong>Max Tyler</strong>
            <p>Block-Fu Song</p>
          </div>
        </div>
        <div class="track"
             data-audio="audio/ADWT_V1.mp3"
             data-title="Alt ADWT Track"
             data-artist="Maxwell Tayler"
             data-context="Alt track for game ADWT"
             data-image="images/GarbageSewer_Album.png">
          <img src="images/GarbageSewer_Album.png" />
          <div>
            <strong>Maxwell Tayler</strong>
            <p>Alt ADWT Track</p>
          </div>
        
      </div>
    </aside>

    <!-- Player -->
    <main class="player">
      <img id="main-image" src="images/GarbageSewer_Album.png" />

      <div class="info">
        <h2 id="song-title">Garbage Sewer</h2>
        <h3 id="artist-name">Max Tayler</h3>
        <p id="context">As heard in: Fantasy RPG Prototype</p>
      </div>

      <audio id="audio" controls src="audio/ClowningAround.ogg"></audio>
    </main>
  </div>
</div>

<script>
  const tracks = document.querySelectorAll('.track');
  const audio = document.getElementById('audio');
  const title = document.getElementById('song-title');
  const artist = document.getElementById('artist-name');
  const context = document.getElementById('context');
  const image = document.getElementById('main-image');

  tracks.forEach(track => {
    track.addEventListener('click', () => {
      tracks.forEach(t => t.classList.remove('active'));
      track.classList.add('active');

      audio.src = track.dataset.audio;
      title.textContent = track.dataset.title;
      artist.textContent = track.dataset.artist;
      context.textContent = track.dataset.context;
      image.src = track.dataset.image;

      audio.play();
    });
  });
</script>

</body>
</html>
